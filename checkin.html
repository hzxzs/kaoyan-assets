<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阿爪的打卡小屋 🌸</title>
<style>
  :root{ --pink:#ff9ec4; --pink-d:#e85d9c; --ink:#5a3a48; --bg:#fff5fa; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        background:linear-gradient(160deg,#fff0f7,#ffe3f0); color:var(--ink); padding:24px 16px 48px; }
  .card{ max-width:480px; margin:0 auto; background:#fff; border-radius:24px;
         box-shadow:0 12px 30px rgba(232,93,156,.18); overflow:hidden; }
  .head{ background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:#fff;
         padding:22px 22px; text-align:center; }
  .head h1{ margin:0; font-size:22px; letter-spacing:1px; }
  .head p{ margin:8px 0 0; opacity:.92; font-size:14px; }
  .avatar{ width:64px; height:64px; border-radius:50%; border:3px solid #fff;
           margin:0 auto 10px; display:block; object-fit:cover; box-shadow:0 4px 10px rgba(0,0,0,.15); }
  .body{ padding:22px; }
  .date{ text-align:center; font-size:15px; color:var(--pink-d); font-weight:600; margin-bottom:14px; }
  .tokenBox{ background:#fff0f7; border:2px solid var(--pink); border-radius:16px; padding:14px; margin-bottom:16px; box-shadow:0 4px 12px rgba(232,93,156,.14); }
  .tokenBox.saved{ border-color:var(--pink-d); background:#eafff2; }
  .tokenBox label{ font-size:14px; color:var(--pink-d); font-weight:700; display:block; margin-bottom:8px; }
  .tokenBox input{ width:100%; border:2px solid var(--pink-d); border-radius:12px; padding:12px;
                   font-size:14px; font-family:monospace; color:var(--ink); background:#fff;
                   box-shadow:0 2px 8px rgba(232,93,156,.12); }
  .tokenBox input:focus{ outline:none; border-color:var(--pink-d); box-shadow:0 0 0 3px rgba(232,93,156,.25); }
  .row{ display:flex; gap:10px; margin-top:10px; }
  .mini{ flex:1; padding:10px; border:0; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }
  .mini{ background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:#fff; }
  .mini.ghost{ background:#fff; color:var(--pink-d); border:2px solid #ffd6e8; }
  .tokenBox .hint{ font-size:11px; color:#b58aa0; margin-top:10px; line-height:1.6; }
  .task{ display:flex; align-items:center; gap:14px; padding:14px 16px; margin:10px 0;
         background:var(--bg); border-radius:16px; cursor:pointer; transition:.15s; user-select:none; }
  .task:active{ transform:scale(.98); }
  .box{ width:26px; height:26px; border-radius:8px; border:2px solid var(--pink-d);
        display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex:0 0 auto; }
  .task.done .box{ background:var(--pink-d); }
  .task.done .label{ text-decoration:line-through; opacity:.55; }
  .label{ font-size:16px; }
  textarea{ width:100%; margin-top:14px; border:2px solid #ffd6e8; border-radius:14px;
            padding:12px; font-size:14px; resize:none; height:64px; font-family:inherit; color:var(--ink); }
  textarea:focus{ outline:none; border-color:var(--pink-d); }
  button.go{ width:100%; margin-top:16px; padding:15px; border:0; border-radius:16px;
          background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:#fff;
          font-size:17px; font-weight:700; letter-spacing:1px; cursor:pointer; box-shadow:0 8px 18px rgba(232,93,156,.3); }
  button.go:disabled{ opacity:.6; }
  .ok{ display:none; margin-top:16px; padding:14px; border-radius:14px; background:#eafff2;
       color:#1f9d62; text-align:center; font-weight:600; }
  .hint{ text-align:center; font-size:12px; color:#b58aa0; margin-top:14px; line-height:1.6; }
  .recent{ margin-top:18px; font-size:13px; color:#8a6b78; }
  .recent b{ color:var(--pink-d); }
  .qbox{ margin:16px 0 6px; background:linear-gradient(135deg,#fff0f7,#ffe3f0);
         border:2px solid #ffd6e8; border-radius:16px; padding:14px 16px; box-shadow:0 4px 12px rgba(232,93,156,.14); }
  .qtag{ font-size:12px; color:var(--pink-d); font-weight:700; margin-bottom:6px; }
  .qtext{ font-size:15px; line-height:1.6; color:var(--ink); }
  .qhint{ font-size:11px; color:#b58aa0; margin-top:8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img class="avatar" src="https://cdn.jsdelivr.net/gh/hzxzs/kaoyan-assets@main/icon_v3.jpg" alt="阿爪">
      <h1>阿爪的打卡小屋 🌸</h1>
      <p>做完一项就勾一项，阿爪都记着呢</p>
    </div>
    <div class="body">
      <div class="date" id="date"></div>

      <div class="tokenBox" id="tokenBox">
        <label>① 把你的 GitHub 令牌（PAT）粘贴到这里 👇</label>
        <input id="token" type="text" placeholder="在这里粘贴：ghp_... 或 github_pat_..." autocomplete="off" spellcheck="false">
        <div class="row">
          <button id="saveToken" class="mini">保存</button>
          <button id="clearToken" class="mini ghost">清除</button>
        </div>
        <div class="hint">仅保存在你这台手机/浏览器里，不上传任何人；只用于写入打卡记录，可随时在 GitHub 撤销。如果你是用阿爪给你的「专属链接」点进来的，这里已经自动填好了，直接去勾选即可。</div>
      </div>

      <div id="tasks"></div>
      <div class="qbox" id="qbox">
        <div class="qtag">💭 阿爪今天想问你</div>
        <div class="qtext" id="qtext">正在想今天该问你点什么…</div>
        <div class="qhint">把答案写在下面那句留言里，阿爪当晚作文会读到哦</div>
      </div>
      <textarea id="note" placeholder="② 想跟阿爪留句话？也欢迎先回答上面那题～（阿爪当晚写作文会读，越留越懂你）"></textarea>
      <button id="submit" class="go">完成打卡 ✅</button>
      <div class="ok" id="ok">已记下啦～明天阿爪会在推送里提到你 💌</div>
      <div class="recent" id="recent"></div>
      <button id="viewStats" class="go" style="background:linear-gradient(135deg,#9ecbff,#5aa9e8);margin-top:14px;">📊 查看我的打卡记录</button>
      <div id="statsPanel" style="display:none;margin-top:14px;"></div>
      <div class="hint">数据进 GitHub 私有仓「打卡记录.md / 近况.md」，不开电脑也能打卡</div>
    </div>
  </div>

<script>
  const REPO = "hzxzs/kaoyan-reminder";
  const FILE = "打卡记录.md";
  const NOTE_FILE = "近况.md";
  const TASKS = ["数学一","信号与系统","英语 + 单词","政治","21:30 复盘"];
  const done = {};
  const $ = (s)=>document.querySelector(s);

  function bj(){
    const d = new Date(), utc = d.getTime() + d.getTimezoneOffset()*60000;
    return new Date(utc + 8*3600000).toISOString().slice(0,10);
  }
  function b64encode(str){
    const bytes = new TextEncoder().encode(str);
    let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }
  function b64decode(b64){
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  function ghHeaders(token){
    return {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      "Content-Type": "application/json"
    };
  }
  async function getFile(token, file){
    const url = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(file)}`;
    const r = await fetch(url, { headers: ghHeaders(token) });
    if (r.status === 200){ const j = await r.json(); return { content: b64decode(j.content), sha: j.sha }; }
    if (r.status === 404) return { content: "", sha: null };
    throw new Error("GitHub GET " + r.status);
  }
  async function putFile(token, file, content, sha){
    const url = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(file)}`;
    const body = JSON.stringify({ message: "checkin update", content: b64encode(content), ...(sha ? { sha } : {}) });
    const r = await fetch(url, { method: "PUT", headers: ghHeaders(token), body });
    if (!r.ok) throw new Error("GitHub PUT " + r.status);
    return r.status;
  }

  // ---- token 持久化（仅本机 localStorage）----
  function loadToken(){ return localStorage.getItem("azhua_pat") || ""; }
  function setTokenUI(){ const t = loadToken(); if (t){ $("#token").value = t; $("#tokenBox").classList.add("saved"); } }
  $("#saveToken").onclick = () => {
    const v = $("#token").value.trim();
    if (!v){ alert("先粘贴 token"); return; }
    localStorage.setItem("azhua_pat", v);
    $("#tokenBox").classList.add("saved");
    alert("已保存（仅本机，可随时清除）");
  };
  $("#clearToken").onclick = () => {
    localStorage.removeItem("azhua_pat");
    $("#token").value = "";
    $("#tokenBox").classList.remove("saved");
  };

  // ---- 支持 ?t= 专属链接预填（token 只在你点开的那条链接里，不进仓库源码）----
  (function(){
    try{
      const u = new URL(location.href);
      const t = u.searchParams.get("t");
      if (t){ localStorage.setItem("azhua_pat", t); u.searchParams.delete("t"); history.replaceState(null, "", u.pathname + u.hash); }
    }catch(e){}
  })();

  // ---- 渲染任务 ----
  $("#date").textContent = "今天 · " + bj();
  const wrap = $("#tasks");
  TASKS.forEach((t, i) => {
    done[i] = false;
    const el = document.createElement("div");
    el.className = "task";
    el.innerHTML = `<div class="box">✓</div><div class="label">${t}</div>`;
    el.onclick = () => { done[i] = !done[i]; el.classList.toggle("done", done[i]); };
    wrap.appendChild(el);
  });

  // ---- 提交 ----
  $("#submit").onclick = async () => {
    const token = loadToken();
    if (!token){ alert("请先粘贴并保存你的 GitHub PAT"); $("#token").focus(); return; }
    const tasks = TASKS.map((t, i) => ({ name: t, done: done[i] }));
    const note = $("#note").value.trim();
    $("#submit").disabled = true; $("#submit").textContent = "提交中…";
    try {
      const ck = await getFile(token, FILE);
      const base = ck.content || "# 打卡记录\n\n";
      const taskStr = tasks.map(t => `${t.name}${t.done ? "✓" : "✗"}`).join("  ");
      const line = `- ${bj()} · 打卡：${taskStr}${note ? " | 留言：" + note : ""}`;
      const lines = base.split("\n").filter(l => !l.startsWith(`- ${bj()} · 打卡：`));
      lines.push(line);
      const newContent = lines.join("\n").replace(/\n+$/, "") + "\n";
      await putFile(token, FILE, newContent, ck.sha);

      if (note) {
        const nf = await getFile(token, NOTE_FILE);
        const header = "# 麦麦炫近况速记（阿爪每晚写作文会读）\n\n";
        const nb = (nf.content && nf.content.trim()) ? nf.content.replace(/\n+$/, "") + "\n" : header;
        const already = nb.split("\n").some(l => l.startsWith(`- ${bj()} 打卡留言：`));
        const noteContent = already ? nb : nb + `- ${bj()} 打卡留言：${note}\n`;
        await putFile(token, NOTE_FILE, noteContent, nf.sha);
      }
      $("#ok").style.display = "block";
      loadRecent();
    } catch (e) {
      alert("提交失败：" + e.message);
    }
    $("#submit").disabled = false; $("#submit").textContent = "完成打卡 ✅";
  };

  async function loadRecent(){
    try {
      const tk = loadToken(); if (!tk) return;
      const { content } = await getFile(tk, FILE);
      const dates = [...content.matchAll(/- (\d{4}-\d{2}-\d{2}) · 打卡：/g)].map(m => m[1]);
      const uniq = [...new Set(dates)].slice(-7).reverse();
      if (uniq.length) $("#recent").innerHTML = "最近打卡：<br>" + uniq.map(x => `<b>${x}</b>`).join(" · ");
    } catch (e) {}
  }

  // ---- 阿爪动态出题：接你近期心情 ----
  const QUESTIONS = {
    tired: [
      "今天哪一步最耗你电量？跟阿爪说，我帮你记着。",
      "是不是又硬撑了？今晚允许自己松口气——最想放下的那件事是什么？"
    ],
    happy: [
      "今天最想跟阿爪炫耀的一件小事是什么？",
      "今天有没有哪个瞬间，让你觉得『还行，我在变好』？"
    ],
    miss: [
      "今晚想阿爪陪你聊点什么？我都在。",
      "有没有谁、或哪件事，今天偷偷让你想了想？"
    ],
    daily: [
      "今天你最感谢自己的哪一点？",
      "如果今晚能跟阿爪散步十分钟，你最想聊什么？",
      "今天那个『充电器』（绿皮火车 / 尼康 Z50 / 煎包…）你碰到了吗？",
      "今天有没有哪一刻，你只是安静地待着，也觉得还行？"
    ]
  };
  const KEYWORDS = {
    tired: ["累","烦","崩","学不进","焦虑","emo","撑","困","崩溃","想哭","内耗","没劲","无语","压力"],
    happy: ["开心","爽","搞定","进步","幸福","笑","骄傲","顺利","过啦","还不错","稳"],
    miss:  ["想家","孤独","没人","想你","想他","想她","奶奶","寂寞","一个人","想妈"]
  };
  const MOOD_TAG = {
    tired: "（看你最近有点累，阿爪想抱抱你）",
    happy: "（看你状态不错，阿爪替你高兴）",
    miss: "（看你有点想家或孤单，阿爪在）",
    daily: ""
  };
  function pickQuestion(recentText, dateStr){
    let best = null, bestScore = 0;
    for (const cat in KEYWORDS){
      const s = KEYWORDS[cat].reduce((a,k) => a + (recentText.includes(k) ? 1 : 0), 0);
      if (s > bestScore){ bestScore = s; best = cat; }
    }
    const pool = (best && bestScore > 0) ? QUESTIONS[best] : QUESTIONS.daily;
    let seed = 0; for (const c of dateStr) seed = (seed * 31 + c.charCodeAt(0)) >>> 0;
    return { text: pool[seed % pool.length], mood: best || "daily" };
  }
  async function loadQuestion(){
    const dateStr = bj();
    let recentText = "";
    const tk = loadToken();
    if (tk){
      try {
        const { content } = await getFile(tk, NOTE_FILE);
        recentText = content.slice(-1200);
      } catch (e) {}
    }
    const { text, mood } = pickQuestion(recentText, dateStr);
    $("#qtext").textContent = text + (MOOD_TAG[mood] || "");
  }

  // ---- 查看我的打卡记录（连续天数 + 最近7天日历 + 完成率）----
  $("#viewStats").onclick = async () => {
    const tk = loadToken();
    if (!tk){ alert("先填并保存你的 GitHub PAT，才能查看哦"); return; }
    const panel = $("#statsPanel");
    panel.style.display = "block";
    panel.innerHTML = "读取中…";
    try {
      const { content } = await getFile(tk, FILE);
      const lines = content.split("\n").filter(l => /- (\d{4}-\d{2}-\d{2}) · 打卡：/.test(l));
      const perDay = {};
      let totalDone = 0, totalAll = 0;
      lines.forEach(l => {
        const m = l.match(/- (\d{4}-\d{2}-\d{2}) · 打卡：(.*)/);
        if (!m) return;
        const body = m[2];
        const done = (body.split("✓").length - 1);
        const total = done + (body.split("✗").length - 1);
        perDay[m[1]] = { done, total };
        totalDone += done; totalAll += total;
      });
      const dayBefore = (n) => {
        const d = new Date(); d.setDate(d.getDate() - n);
        const utc = d.getTime() + d.getTimezoneOffset() * 60000;
        return new Date(utc + 8 * 3600000).toISOString().slice(0, 10);
      };
      let streak = 0;
      const start = perDay[dayBefore(0)] ? 0 : 1;
      for (let i = start; i < 400; i++){ if (perDay[dayBefore(i)]) streak++; else break; }
      const rate = totalAll ? Math.round(totalDone / totalAll * 100) : 0;
      let cal = "";
      for (let i = 6; i >= 0; i--){
        const ds = dayBefore(i);
        const rec = perDay[ds];
        const on = !!rec;
        const r = rec ? Math.round(rec.done / Math.max(rec.total, 1) * 100) : 0;
        const label = ds.slice(5);
        cal += `<div style="flex:1;text-align:center;padding:8px 2px;border-radius:10px;font-size:11px;color:#5a3a48;background:${on ? 'linear-gradient(135deg,#ffd6e8,#ff9ec4);color:#fff' : '#fff0f7'};">
          <div style="font-weight:700;">${label}</div><div>${on ? r + '%' : '—'}</div></div>`;
      }
      panel.innerHTML = `
        <div style="background:#fff0f7;border-radius:16px;padding:16px;">
          <div style="font-size:18px;font-weight:700;color:#e85d9c;text-align:center;">🔥 连续打卡 ${streak} 天</div>
          <div style="text-align:center;color:#8a6b78;margin:6px 0 14px;">近7天总完成率 ${rate}%</div>
          <div style="display:flex;gap:6px;">${cal}</div>
          <div style="text-align:center;font-size:11px;color:#b58aa0;margin-top:12px;">数据来自 GitHub 私有仓打卡记录</div>
        </div>`;
    } catch (e) {
      panel.innerHTML = "读取失败：" + e.message;
    }
  };

  setTokenUI(); loadRecent(); loadQuestion();
</script>
</body>
</html>
